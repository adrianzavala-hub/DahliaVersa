<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control incidencias</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-decoration: none;
        list-style: none;
    }

    body {
        background-color: #d8a4b0;
        background-image: url('img/fondo.jpeg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        margin: 0;
    }


    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        position: relative;
        z-index: 100;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 1.2rem;
        cursor: pointer;
        user-select: none;
    }

    .logo-icon {
        width: 36px;
        height: 36px;
        position: relative;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: spin 20s linear infinite;
    }

    .dahlia-petal {
        position: absolute;
        top: 50%;
        left: 50%;
        background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
        border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
        transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.1);
    }

    .dahlia-petal.outer {
        width: 9px;
        height: 16px;
        background: linear-gradient(135deg, #bae6fd 0%, #7dd3fc 60%, #38bdf8 100%);
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-10px);
    }

    .dahlia-petal.mid {
        width: 7px;
        height: 13px;
        background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 60%, #7dd3fc 100%);
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-7px);
    }

    .dahlia-petal.inner {
        width: 5px;
        height: 9px;
        background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #bae6fd 100%);
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-4px);
    }

    .dahlia-neon-outline {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 11px;
        height: 18px;
        background: transparent;
        border: 1.5px solid #7dd3fc;
        border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-10.5px);
        box-shadow: 0 0 6px rgba(125, 211, 252, 0.6), inset 0 0 4px rgba(56, 189, 248, 0.4);
        pointer-events: none;
    }

    .dahlia-neon-pink-outline {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 11px;
        height: 18px;
        background: transparent;
        border: 1.5px solid #bae6fd;
        border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
        transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-10.5px);
        box-shadow: 0 0 6px rgba(186, 230, 253, 0.6), inset 0 0 4px rgba(125, 211, 252, 0.4);
        pointer-events: none;
    }

    .dahlia-center {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        background-color: #fbcfe8;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 6px rgba(244, 114, 182, 0.6);
        transition: transform 0.5s ease;
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .nav-links {
        display: flex;
        gap: 25px;
        background: rgba(125, 95, 105, 0.45);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        padding: 10px 24px;
        border-radius: 30px;
        border: 1px solid rgba(226, 169, 179, 0.35);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(226, 169, 179, 0.1);
        overflow: visible !important;
    }

    .nav-links a {
        color: #ffffff;
        font-size: 0.9rem;
        transition: color 0.3s ease;
    }

    .nav-links a:hover {
        color: #ffffff;
    }

    .btn-nav {
        background: linear-gradient(135deg, #bae6fd 0%, #7dd3fc 100%);
        color: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 10px 22px;
        border-radius: 20px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(125, 211, 252, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
    }

    .btn-nav:hover {
        background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
        color: #0f172a;
        transform: translateY(-3px) scale(1.04);
        box-shadow: 0 6px 20px rgba(125, 211, 252, 0.5);
    }
</style>

            <span class="dahlia-neon-outline" style="--angle: 270deg;"></span>
            <span class="dahlia-neon-outline" style="--angle: 315deg;"></span>
            <span class="dahlia-petal outer" style="--angle: 0deg;"></span>
            <span class="dahlia-petal outer" style="--angle: 45deg;"></span>
            <span class="dahlia-petal outer" style="--angle: 90deg;"></span>
            <span class="dahlia-petal outer" style="--angle: 135deg;"></span>
            <span class="dahlia-petal outer" style="--angle: 180deg;"></span>
            <span class="dahlia-petal outer" style="--angle: 225deg;"></span>
            <span class="dahlia-petal outer" style="--angle: 270deg;"></span>
            <span class="dahlia-petal outer" style="--angle: 315deg;"></span>
            <span class="dahlia-petal mid" style="--angle: 22.5deg;"></span>
            <span class="dahlia-petal mid" style="--angle: 67.5deg;"></span>
            <span class="dahlia-petal mid" style="--angle: 112.5deg;"></span>
            <span class="dahlia-petal mid" style="--angle: 157.5deg;"></span>
            <span class="dahlia-petal mid" style="--angle: 202.5deg;"></span>
            <span class="dahlia-petal mid" style="--angle: 247.5deg;"></span>
            <span class="dahlia-petal mid" style="--angle: 292.5deg;"></span>
            <span class="dahlia-petal mid" style="--angle: 337.5deg;"></span>
            <span class="dahlia-petal inner" style="--angle: 0deg;"></span>
            <span class="dahlia-petal inner" style="--angle: 45deg;"></span>
            <span class="dahlia-petal inner" style="--angle: 90deg;"></span>
            <span class="dahlia-petal inner" style="--angle: 135deg;"></span>
            <span class="dahlia-petal inner" style="--angle: 180deg;"></span>
            <span class="dahlia-petal inner" style="--angle: 225deg;"></span>
            <span class="dahlia-petal inner" style="--angle: 270deg;"></span>
            <span class="dahlia-petal inner" style="--angle: 315deg;"></span>
            <span class="dahlia-center" id="dahliaCenter"></span>
        </div>
    </div>
    <nav class="nav-container">
        <ul class="nav-links">
            <li><a href="#">Cerrar sesion</a></li>
            <li><a href="mailto:olguinzavalaadrian099@gmail.com">Contactanos</a></li>

        </ul>
    </nav>

</header>
