<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control incidencias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            list-style: none;
        }

        body {
            background-color: #d8a4b0;
            background-image: url('img/empresa.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        .navbar {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            user-select: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 20s linear infinite;
        }

        /* Pétalos con tonos rosa coral, rojo salmón y vino suave inspirados en las dahlias */
        .dahlia-petal {
            position: absolute;
            top: 50%;
            left: 50%;
            background: linear-gradient(135deg, #f8a594 0%, #e06c5f 50%, #b8403b 100%);
            border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease;
            box-shadow: 0 0 4px rgba(184, 64, 59, 0.3);
        }

        .dahlia-petal.outer {
            width: 9px;
            height: 16px;
            background: linear-gradient(135deg, #e06c5f 0%, #ca4e46 60%, #9e322d 100%);
            transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-10px);
        }

        .dahlia-petal.mid {
            width: 7px;
            height: 13px;
            background: linear-gradient(135deg, #f8a594 0%, #e06c5f 60%, #ca4e46 100%);
            transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-7px);
        }

        .dahlia-petal.inner {
            width: 5px;
            height: 9px;
            background: linear-gradient(135deg, #fcd5ce 0%, #f8a594 50%, #e06c5f 100%);
            transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-4px);
        }

        .dahlia-neon-outline {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 11px;
            height: 18px;
            background: transparent;
            border: 1.5px solid #f8a594;
            border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
            transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-10.5px);
            box-shadow: 0 0 6px rgba(248, 165, 148, 0.6), inset 0 0 4px rgba(224, 108, 95, 0.4);
            pointer-events: none;
        }

        .dahlia-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: #fcd5ce;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(224, 108, 95, 0.9);
            transition: transform 0.5s ease;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Navbar con tono rojo cálido traslúcido tipo cristal */
        .nav-links {
            display: flex;
            gap: 25px;
            background: rgba(120, 35, 40, 0.55);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(248, 165, 148, 0.35);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25), inset 0 0 15px rgba(224, 108, 95, 0.2);
        }

        .nav-links a {
            color: #ffffff;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #fcd5ce;
        }

        /* Botón con degradado rojo coral cálido */
        .btn-nav {
            background: linear-gradient(135deg, #f8a594 0%, #e06c5f 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(224, 108, 95, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .btn-nav:hover {
            background: linear-gradient(135deg, #fcd5ce 0%, #f8a594 100%);
            color: #5c181b;
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 6px 20px rgba(248, 165, 148, 0.6);
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="logo" id="logoTrigger">
            <div class="logo-icon" id="logoIcon">
                <span class="dahlia-neon-outline" style="--angle: 0deg;"></span>
                <span class="dahlia-neon-outline" style="--angle: 45deg;"></span>
                <span class="dahlia-neon-outline" style="--angle: 90deg;"></span>
                <span class="dahlia-neon-outline" style="--angle: 135deg;"></span>
                <span class="dahlia-neon-outline" style="--angle: 180deg;"></span>
                <span class="dahlia-neon-outline" style="--angle: 225deg;"></span>
                <span class="dahlia-neon-outline" style="--angle: 270deg;"></span>
                <span class="dahlia-neon-outline" style="--angle: 315deg;"></span>
                <span class="dahlia-petal outer" style="--angle: 0deg;"></span>
                <span class="dahlia-petal outer" style="--angle: 45deg;"></span>
                <span class="dahlia-petal outer" style="--angle: 90deg;"></span>
                <span class="dahlia-petal outer" style="--angle: 135deg;"></span>
                <span class="dahlia-petal outer" style="--angle: 180deg;"></span>
                <span class="dahlia-petal outer" style="--angle: 225deg;"></span>
                <span class="dahlia-petal outer" style="--angle: 270deg;"></span>
                <span class="dahlia-petal outer" style="--angle: 315deg;"></span>
                <span class="dahlia-petal mid" style="--angle: 22.5deg;"></span>
                <span class="dahlia-petal mid" style="--angle: 67.5deg;"></span>
                <span class="dahlia-petal mid" style="--angle: 112.5deg;"></span>
                <span class="dahlia-petal mid" style="--angle: 157.5deg;"></span>
                <span class="dahlia-petal mid" style="--angle: 202.5deg;"></span>
                <span class="dahlia-petal mid" style="--angle: 247.5deg;"></span>
                <span class="dahlia-petal mid" style="--angle: 292.5deg;"></span>
                <span class="dahlia-petal mid" style="--angle: 337.5deg;"></span>
                <span class="dahlia-petal inner" style="--angle: 0deg;"></span>
                <span class="dahlia-petal inner" style="--angle: 45deg;"></span>
                <span class="dahlia-petal inner" style="--angle: 90deg;"></span>
                <span class="dahlia-petal inner" style="--angle: 135deg;"></span>
                <span class="dahlia-petal inner" style="--angle: 180deg;"></span>
                <span class="dahlia-petal inner" style="--angle: 225deg;"></span>
                <span class="dahlia-petal inner" style="--angle: 270deg;"></span>
                <span class="dahlia-petal inner" style="--angle: 315deg;"></span>
                <span class="dahlia-center" id="dahliaCenter"></span>
            </div>
        </div>
        <nav class="nav-container">
            <ul class="nav-links">
                <li><a href="#">Cerrar sesión</a></li>
                <li><a href="mailto:olguinzavalaadrian099@gmail.com">Contáctanos</a></li>
                <li><a href="#">Cambiar de usuario</a></li>
            </ul>
        </nav>
        <a href="index.html" class="btn-nav" id="backToHomeBtn">Volver al Inicio</a>
    </header>
</body>

</html>
