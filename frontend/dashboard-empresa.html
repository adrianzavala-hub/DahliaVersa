<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Empresa - DahliaVersa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
            text-decoration: none;
            list-style: none;
        }

        body {
            background-color: #d8a4b0;
            background-image: url('img/fondo.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR ACTUALIZADO CON TONOS NARANJAS / ÁMBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(55, 25, 12, 0.6);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(249, 115, 22, 0.4);
        }

        .logo h2 {
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 700;
        }

        .nav-links a {
            color: #fed7aa;
            font-weight: 600;
            padding: 8px 18px;
            background: rgba(249, 115, 22, 0.2);
            border: 1px solid rgba(249, 115, 22, 0.35);
            border-radius: 12px;
            transition: background 0.3s, transform 0.2s;
        }

        .nav-links a:hover {
            background: rgba(249, 115, 22, 0.4);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* CONTENEDOR PRINCIPAL CON LA PALETA CÁLIDA */
        .dashboard-wrapper {
            width: 90%;
            max-width: 1300px;
            margin: 40px auto;
            flex: 1;
        }

        .admin-section {
            background: rgba(55, 25, 12, 0.65);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.4);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(249, 115, 22, 0.15);
        }

        .admin-section h3 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .subtitle {
            color: #fed7aa;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .table-container {
            overflow-x: auto;
        }

        .reports-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .reports-table th, .reports-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .reports-table th {
            background: rgba(249, 115, 22, 0.25);
            color: #fed7aa;
            font-weight: 600;
        }

        .reports-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .status-select {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            outline: none;
            cursor: pointer;
        }

        .status-select option {
            background: #3c190c;
            color: #ffffff;
        }

        .btn-update {
            padding: 8px 14px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.4);
            transition: transform 0.2s, filter 0.2s;
        }

        .btn-update:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>Panel de Control - DahliaVersa</h2>
        </div>
        <nav class="nav-links">
            <a href="index.html">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="dashboard-wrapper">
        <section class="admin-section">
            <h3>Gestión de Incidencias Registradas</h3>
            <p class="subtitle">Actualiza el estado de los reportes ciudadanos en tiempo real desde la base de datos.</p>
            
            <div class="table-container">
                <table class="reports-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tipo</th>
                            <th>Ciudadano</th>
                            <th>Teléfono</th>
                            <th>Fecha</th>
                            <th>Referencias</th>
                            <th>Estado Actual</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaReportesEmpresa">
                        <tr>
                            <td colspan="8" style="text-align: center;">Cargando reportes desde el servidor...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarReportesEmpresa();
        });

        async function cargarReportesEmpresa() {
            const tablaBody = document.getElementById('tablaReportesEmpresa');
            
            try {
                const response = await fetch('https://dahliaversa1.onrender.com/api/empresa/reportes');
                if (!response.ok) throw new Error("Error al obtener los reportes de la empresa");

                const reportes = await response.json();
                tablaBody.innerHTML = '';

                if (reportes.length === 0) {
                    tablaBody.innerHTML = `<tr><td colspan="8" style="text-align: center;">No hay reportes registrados en este momento.</td></tr>`;
                    return;
                }

                reportes.forEach(rep => {
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>#${rep.id}</td>
                        <td><span style="text-transform: uppercase; font-weight: 600; color: #fed7aa;">${rep.tipo}</span></td>
                        <td>${rep.nombre}</td>
                        <td>${rep.telefono || 'N/D'}</td>
                        <td>${rep.fecha ? new Date(rep.fecha).toLocaleDateString() : 'N/D'}</td>
                        <td>${rep.referencias || 'Sin referencias'}</td>
                        <td>
                            <select class="status-select" id="status-${rep.tipo}-${rep.id}">
                                <option value="aprobado" ${rep.estado === 'aprobado' ? 'selected' : ''}>Aprobado</option>
                                <option value="en proceso" ${rep.estado === 'en proceso' ? 'selected' : ''}>En Proceso</option>
                                <option value="atendido" ${rep.estado === 'atendido' ? 'selected' : ''}>Atendido</option>
                                <option value="rechazado" ${rep.estado === 'rechazado' ? 'selected' : ''}>Rechazado</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn-update" onclick="actualizarEstadoReporte('${rep.tipo}', ${rep.id})">Guardar</button>
                        </td>
                    `;
                    tablaBody.appendChild(tr);
                });

            } catch (error) {
                console.error("Error cargando panel:", error);
                tablaBody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #f97316;">Error al conectar con el servidor de la API.</td></tr>`;
            }
        }

        async function actualizarEstadoReporte(tipo, id) {
            const selectElement = document.getElementById(`status-${tipo}-${id}`);
            const nuevoEstado = selectElement.value;

            try {
                const response = await fetch('https://dahliaversa1.onrender.com/api/empresa/actualizar-estado', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        tipo: tipo,
                        id: id,
                        estado: nuevoEstado
                    })
                });

                const resultado = await response.json();

                if (response.ok && resultado.status === 'success') {
                    alert(`¡Éxito! El reporte #${id} (${tipo}) se actualizó a: ${nuevoEstado.toUpperCase()}`);
                    cargarReportesEmpresa(); 
                } else {
                    alert("⚠️ No se pudo actualizar el estado en la base de datos.");
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                alert("Error de conexión al intentar actualizar el estado.");
            }
        }
    </script>
</body>
</html>
